<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>old scrapbook index</title>
  <style>
    body{margin:0;background:#f2d6b8;color:#24191a;font:16px/1.4 'Courier New',monospace}
    main{width:min(680px,calc(100% - 28px));margin:28px auto;padding:18px;background:#fff8df;border:3px ridge #bd8060;box-shadow:7px 7px #8d5b4d}
    h1{margin-top:0;color:#8a216e;text-shadow:2px 2px #f2a4cf} a{color:#174f9e} li{margin:8px 0}
    .tiny{font-size:12px;color:#754c42;border-top:1px dotted #754c42;padding-top:10px}
  </style>
</head>
<body>
  <main>
    <h1>old scrapbook index</h1>
    <p>some things from the homepage were tucked away before the letter was mailed.</p>
    <!-- The order matters. The first scrap tells you how to read the second. -->
    <ul>
      <li><a href="scraps/rose.gif">rose.gif</a></li>
      <li><a href="scraps/postcard.jpg">postcard.jpg</a></li>
      <li><a href="scraps/envelope.txt">envelope.txt</a></li>
    </ul>
    <p class="tiny">a browser shows the picture; a forensic tool shows what it remembers.</p>
  </main>
</body>
</html>
